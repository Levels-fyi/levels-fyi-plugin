name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: npm run build:strict
      - name: Generated files match the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files are out of date. Run npm run build and commit the result."
            exit 1
          fi
      - name: Validate for the Claude directory
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate plugin --profile directory --strict
